<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>応募下書きコピー</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; margin: 0; padding: 16px;
         background: #12263a; color: #e8f1f5; }
  .card { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 8px 0 12px; }
  textarea { width: 100%; height: 260px; box-sizing: border-box; font-size: 14px;
             border-radius: 10px; border: 1px solid #35506b; padding: 10px;
             background: #e8f1f5; color: #12263a; }
  .btn { display: block; width: 100%; box-sizing: border-box; text-align: center;
         padding: 16px; margin-top: 12px; border: 0; border-radius: 12px;
         font-size: 17px; font-weight: 700; text-decoration: none; cursor: pointer; }
  #copyBtn { background: #0fa3a3; color: #fff; }
  #openBtn { background: #d4a017; color: #12263a; opacity: .45; pointer-events: none; }
  #openBtn.ready { opacity: 1; pointer-events: auto; }
  .note { font-size: 12px; color: #9db8cf; margin-top: 10px; line-height: 1.6; }
  #done { color: #7be0c3; font-weight: 700; display: none; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>応募文の下書き</h1>
  <textarea id="draft" readonly></textarea>
  <button id="copyBtn" class="btn">① 下書きをコピー</button>
  <div id="done">コピーしました</div>
  <a id="openBtn" class="btn" target="_blank" rel="noopener">② 応募ページを開く（貼り付けて使う）</a>
  <p class="note">このページは下書きの受け渡し専用です。応募の送信は必ずランサーズの画面で内容を確認してから行ってください。</p>
</div>
<script>
(function () {
  function b64uDecode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  var q = new URLSearchParams(location.search);
  var draft = "";
  try { draft = b64uDecode(q.get("t") || ""); } catch (e) { draft = ""; }
  var url = q.get("u") || "";
  var ta = document.getElementById("draft");
  ta.value = draft || "(下書きがありません)";
  var open = document.getElementById("openBtn");
  // 開けるのはランサーズのみ（リンク改ざんで他サイトへ飛ばされない安全弁）
  var okHost = /^https:\/\/(www\.lancers\.jp|professional-agent\.lancers\.jp)\//.test(url);
  if (okHost) { open.href = url; } else { open.textContent = "② 応募ページURLが不正です"; }
  document.getElementById("copyBtn").addEventListener("click", function () {
    var showDone = function () {
      document.getElementById("done").style.display = "block";
      if (okHost) open.classList.add("ready");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(showDone, function () {
        ta.select(); document.execCommand("copy"); showDone();
      });
    } else {
      ta.select(); document.execCommand("copy"); showDone();
    }
  });
})();
</script>
</body>
</html>
