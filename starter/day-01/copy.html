<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>copy</title><style>html,body{margin:0;padding:0;background:transparent;}body{display:flex;align-items:center;}.c{-webkit-appearance:none;appearance:none;border:0;cursor:pointer;background:#0FB5A6;color:#fff;font-weight:700;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;padding:0 18px;height:40px;border-radius:999px;width:100%;}.c:active{transform:translateY(1px);}.c.done{background:#0B1F3A;}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}</style></head><body><button type="button" id="b" class="c">コピー</button><p id="live" class="sr" role="status" aria-live="polite"></p><script>var T="あなたは、初心者の経験や能力を、小さな成果物へ変える伴走者です。\n\n私が14日間で完成させられる成果物候補を3つ提案してください。\n\n成果物は次のどれかに分類してください。\n\n1. 発信ルート\n2. 提供物ルート\n3. 仕事ルート\n\n提案前に、次の内容を1問ずつ質問してください。\n\n・これまで経験した仕事\n・人から頼られたこと\n・過去に困って解決したこと\n・興味があるテーマ\n・1日に使える時間\n・使用できるAIやツール\n・人へ見せられる範囲\n\n質問が終わったら、各候補について次を出してください。\n\n・成果物名\n・ルート\n・誰に役立つか\n・14日間で作れる理由\n・20分版で今日やること\n・難易度\n・最初の一歩\n\n専門用語を使わず、初心者でも理解できる言葉で回答してください。";var b=document.getElementById('b'),live=document.getElementById('live'),lbl=b.textContent;function ok(){b.classList.add('done');b.textContent='コピーしました';if(live)live.textContent='プロンプトをコピーしました';setTimeout(function(){b.classList.remove('done');b.textContent=lbl;if(live)live.textContent='';},1600);}function fb(){var t=document.createElement('textarea');t.value=T;t.setAttribute('readonly','');t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.focus();t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);}b.addEventListener('click',function(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(T).then(ok,function(){fb();ok();});}else{fb();ok();}});</script></body></html>
